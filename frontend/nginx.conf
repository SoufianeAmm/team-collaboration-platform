server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API - proxied so the browser sees everything as one origin, same-origin, no CORS needed.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP/WebSocket - needs the Upgrade handshake headers and a long read timeout
    # (it's a long-lived connection, not a request/response round trip).
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback - unknown paths (e.g. a refresh on /projects/5) resolve client-side via the
    # router, so they all need to actually serve index.html instead of a raw 404.
    location / {
        try_files $uri /index.html;
    }
}
