spring.application.name=backend
server.port=8080

# --- Database (SQLite) ---
# Stored as a plain local file - no database server to install or run.
# Override with the DB_PATH env var later (e.g. in Docker) without touching code.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./app.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Tells Hibernate how to speak SQLite's SQL dialect (data types, auto-increment syntax, etc).
# Swapping to Postgres later means changing this line + the two above, nothing else.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# "update": Hibernate creates/updates tables from our @Entity classes automatically.
# Fine for local development; a real deployment would use versioned migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- File storage ---
file.upload-directory=${UPLOAD_DIRECTORY:./uploads}
file.max-size-mb=${MAX_FILE_SIZE_MB:10}
# Servlet-level cap - requests larger than this are rejected before our own validation even runs.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE_MB:10}MB

# --- JWT ---
# Dev-only fallback secret below - real deployments must set JWT_SECRET as an actual env var.
# HS256 requires a key of at least 256 bits (32 bytes); the fallback is long enough for that.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-this-before-any-real-deployment}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS ---
# The Vite dev server's origin - the only frontend allowed to call this API right now.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- Scheduled jobs ---
# Standard 6-field cron (includes seconds): default runs once daily at 8am.
app.deadline-check-cron=${DEADLINE_CHECK_CRON:0 0 8 * * *}
